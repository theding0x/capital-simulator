# Local development stack for capital-simulator.
# Bring up the whole economy with: docker compose up --build
name: capital-simulator

services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: capital
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./deploy/mysql/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcapital"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      LOG_LEVEL: info
      SERVICE_ADDR: ":8080"
      COMMODITY_SERVICE_URL: http://commodity-service:8081
    ports:
      - "8080:8080"
    depends_on:
      commodity-service:
        condition: service_started

  commodity-service:
    build:
      context: .
      dockerfile: services/commodity-service/Dockerfile
    environment:
      LOG_LEVEL: info
      SERVICE_ADDR: ":8081"
      MYSQL_DSN: "root:capital@tcp(mysql:3306)/commodity?parseTime=true&loc=UTC"
      REDIS_ADDR: redis:6379
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent-service:
    build:
      context: .
      dockerfile: services/agent-service/Dockerfile
    environment:
      LOG_LEVEL: info
      SERVICE_ADDR: ":8082"
      MYSQL_DSN: "root:capital@tcp(mysql:3306)/agent?parseTime=true&loc=UTC"
      REDIS_ADDR: redis:6379
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  market-service:
    build:
      context: .
      dockerfile: services/market-service/Dockerfile
    environment:
      LOG_LEVEL: info
      SERVICE_ADDR: ":8083"
      MYSQL_DSN: "root:capital@tcp(mysql:3306)/market?parseTime=true&loc=UTC"
      REDIS_ADDR: redis:6379
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  simulation-engine:
    build:
      context: .
      dockerfile: services/simulation-engine/Dockerfile
    environment:
      LOG_LEVEL: info
      SERVICE_ADDR: ":8084"
      MYSQL_DSN: "root:capital@tcp(mysql:3306)/simulation?parseTime=true&loc=UTC"
      REDIS_ADDR: redis:6379
      AGENT_SERVICE_URL: http://agent-service:8082
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

volumes:
  mysql_data:
  redis_data:
