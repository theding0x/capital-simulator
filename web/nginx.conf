server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls to the api-gateway Cloud Run service.
  # API_GATEWAY_URL and API_GATEWAY_HOST are injected at container start via
  # nginx's envsubst template mechanism (this file lives in /etc/nginx/templates/).
  location /api/ {
    proxy_pass ${API_GATEWAY_URL}/;
    proxy_ssl_server_name on;
    proxy_set_header Host ${API_GATEWAY_HOST};
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
