apiVersion: v1
kind: Service
metadata:
  name: simulation-engine
  labels:
    app: simulation-engine
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8084
      name: http
  selector:
    app: simulation-engine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulation-engine
  template:
    metadata:
      labels:
        app: simulation-engine
    spec:
      containers:
        - name: simulation-engine
          image: ghcr.io/theding0x/capital-simulator/simulation-engine:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
              name: http
          env:
            - name: SERVICE_ADDR
              value: ":8084"
            - name: LOG_LEVEL
              value: info
            - name: MYSQL_DSN
              value: "root:capital@tcp(mysql:3306)/simulation?parseTime=true&loc=UTC"
            - name: REDIS_ADDR
              value: redis:6379
            - name: AGENT_SERVICE_URL
              value: http://agent-service:8082
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
