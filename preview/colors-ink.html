<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.rows { display: flex; flex-direction: column; gap: 12px; }
.r { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 4px; }
.chip { width: 48px; height: 48px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.04); }
.name { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; }
.sample-display { font-family: var(--font-display); font-size: 1.1rem; }
.sample-body { font-family: var(--font-sans); font-size: 0.92rem; }
.hex { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-muted); }
</style></head><body><div class="card-frame">
<div class="rows">
  <div class="r"><div class="chip" style="background:#e8e2d5"></div>
    <div><span class="name" style="color:#e8e2d5">ink</span><div class="sample-display" style="color:#e8e2d5">An immense collection of commodities</div></div>
    <div class="hex">#e8e2d5</div></div>
  <div class="r"><div class="chip" style="background:#8a8578"></div>
    <div><span class="name" style="color:#8a8578">ink-muted</span><div class="sample-body" style="color:#8a8578; font-style: italic">Commodities cannot go to market of their own account.</div></div>
    <div class="hex">#8a8578</div></div>
  <div class="r"><div class="chip" style="background:#3a3830"></div>
    <div><span class="name" style="color:#3a3830">ink-dim</span><div class="sample-body mono" style="color:#3a3830; font-size:0.7rem; letter-spacing:0.2em; text-transform:uppercase">VOL. I &middot; CHAPTER 01</div></div>
    <div class="hex">#3a3830</div></div>
</div>
</div></body></html>
