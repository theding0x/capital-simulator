<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.sw { border: 1px solid var(--border-subtle); border-radius: 4px; overflow: hidden; }
.sw .chip { height: 78px; }
.sw .meta { padding: 8px 10px; background: var(--surface); }
.sw .name { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); }
.sw .hex { font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-muted); margin-top: 2px; }
</style></head>
<body><div class="card-frame">
<div class="swatches">
  <div class="sw"><div class="chip" style="background:#07080a"></div><div class="meta"><div class="name">bg</div><div class="hex">#07080a</div></div></div>
  <div class="sw"><div class="chip" style="background:#0f1014"></div><div class="meta"><div class="name">surface</div><div class="hex">#0f1014</div></div></div>
  <div class="sw"><div class="chip" style="background:#15171d"></div><div class="meta"><div class="name">raised</div><div class="hex">#15171d</div></div></div>
  <div class="sw"><div class="chip" style="background:#1a1d25"></div><div class="meta"><div class="name">hover</div><div class="hex">#1a1d25</div></div></div>
</div>
</div></body></html>
