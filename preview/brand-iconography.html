<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.cell { background: var(--surface); border: 1px solid var(--border-subtle); padding: 16px 8px 10px; text-align: center; }
.glyph { font-family: var(--font-mono); font-size: 1.6rem; color: var(--ink); line-height: 1; }
.cap { font-family: var(--font-mono); font-size: 0.55rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-dim); margin-top: 8px; }
.note { font-family: var(--font-sans); font-style: italic; font-size: 0.78rem; color: var(--ink-muted); margin-top: 14px; max-width: 580px; line-height: 1.55; }
</style></head><body><div class="card-frame">
<div class="grid">
  <div class="cell"><div class="glyph" style="color:#5a6a9e">›</div><div class="cap">active</div></div>
  <div class="cell"><div class="glyph" style="color:#9d7a2a">✓</div><div class="cap">done</div></div>
  <div class="cell"><div class="glyph">—</div><div class="cap">empty opt</div></div>
  <div class="cell"><div class="glyph">≡</div><div class="cap">equiv</div></div>
  <div class="cell"><div class="glyph">→</div><div class="cap">arrow</div></div>
  <div class="cell"><div class="glyph">·</div><div class="cap">middot</div></div>
</div>
<div class="note">No icon font, no SVG icon set. The product uses Unicode glyphs in Meslo LG. Two SVG data-URIs exist in the codebase: the grain texture and the select chevron — both treated as background materials, not icons.</div>
</div></body></html>
