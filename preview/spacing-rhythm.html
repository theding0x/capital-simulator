<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.note { font-family: var(--font-sans); font-style: italic; font-size: 0.78rem; color: var(--ink-muted); margin-bottom: 14px; max-width: 540px; line-height: 1.55; }
.demo { background: var(--surface); padding: 0 22px; border: 1px solid var(--border-subtle); }
.section { padding: 22px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
.section:last-child { border-bottom: none; }
.h { font-family: var(--font-mono); font-size: 0.65rem; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 16px; }
.b { font-family: var(--font-display); font-size: 1.05rem; color: var(--ink); }
.s { font-family: var(--font-sans); font-style: italic; font-size: 0.82rem; color: var(--ink-muted); margin-top: 4px; }
</style></head><body><div class="card-frame">
<div class="note">Cards are bands, not boxes. Vertical rhythm comes from <code style="color:var(--ink)">2rem 0</code> padding and 1px hairline rules — no shadows, no enclosing borders, no fills.</div>
<div class="demo">
  <div class="section">
    <div class="h">Register a commodity</div>
    <div class="b">linen</div>
    <div class="s">linen for clothing — per yard</div>
  </div>
  <div class="section">
    <div class="h">Exchange ratio</div>
    <div class="b">20 yards = 1 coat</div>
    <div class="s">common value: 120 min</div>
  </div>
</div>
</div></body></html>
