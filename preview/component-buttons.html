<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
button { display:inline-flex; align-items:center; gap:0.4rem; padding:0.42rem 1rem; border:1px solid var(--border); border-radius:4px; font-family: var(--font-mono); font-size: 0.75rem; letter-spacing:0.05em; font-weight:500; text-transform:uppercase; cursor:pointer; background:transparent; color:var(--ink); transition: all 0.12s; }
button.primary { background: rgba(74,90,138,0.14); border-color:#4a5a8a; color:#5a6a9e; }
button.primary.hover { background:#4a5a8a; border-color:#4a5a8a; color:#fff; }
button.secondary { color: var(--ink-muted); }
button.secondary.hover { border-color: var(--ink-muted); color: var(--ink); background: var(--surface-raised); }
button.danger { border-color: transparent; color: var(--ink-dim); }
button.danger.hover { background: rgba(192,57,43,0.14); border-color:#c0392b; color:#c0392b; }
button.reveal { background: rgba(157,122,42,0.08); border-color: rgba(157,122,42,0.22); color: #c8a240; }
button.reveal.hover { background: #9d7a2a; border-color:#9d7a2a; color: #fff; }
button:disabled { opacity: 0.35; cursor: not-allowed; }
.row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items:center; }
.lbl { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing:0.2em; text-transform:uppercase; color: var(--ink-dim); width: 80px; flex-shrink: 0; }
</style></head><body><div class="card-frame">
<div class="row"><div class="lbl">Default</div>
  <button class="primary">Register</button>
  <button class="secondary">Cancel</button>
  <button class="reveal">Reveal</button>
  <button class="danger">Delete</button>
</div>
<div class="row"><div class="lbl">Hover</div>
  <button class="primary hover">Register</button>
  <button class="secondary hover">Cancel</button>
  <button class="reveal hover">Reveal</button>
  <button class="danger hover">Delete</button>
</div>
<div class="row"><div class="lbl">Disabled</div>
  <button class="primary" disabled>Saving…</button>
  <button class="secondary" disabled>Cancel</button>
  <button class="reveal" disabled>Reveal</button>
</div>
</div></body></html>
