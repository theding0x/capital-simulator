<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
thead th { text-align: left; font-family: var(--font-mono); font-size: 0.62rem; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-dim); padding: 0 1rem 0.75rem 0; border-bottom: 1px solid var(--rule); }
tbody tr { border-bottom: 1px solid var(--border-subtle); }
tbody tr:last-child { border: none; }
tbody tr.hover > td { background: var(--surface-raised); }
tbody tr.hover > td:first-child { border-radius: 4px 0 0 4px; }
tbody tr.hover > td:last-child { border-radius: 0 4px 4px 0; }
tbody td { padding: 0.85rem 1rem 0.85rem 0; vertical-align: middle; }
.name { font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; color: var(--ink); }
.muted { color: var(--ink-muted); }
.snlt { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.85rem; color: #5a6a9e; }
.actions { display: flex; gap: 0.35rem; justify-content: flex-end; }
.btn { display: inline-flex; padding: 0.32rem 0.7rem; border: 1px solid var(--border); border-radius: 4px; font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-muted); background: transparent; }
.btn.reveal { background: rgba(157,122,42,0.08); border-color: rgba(157,122,42,0.22); color: #c8a240; }
.small { font-size: 0.78rem; }
</style></head><body><div class="card-frame">
<table>
  <thead><tr><th>Name</th><th>Use-value</th><th>Concrete labour</th><th>SNLT / unit</th><th></th></tr></thead>
  <tbody>
    <tr><td class="name">linen</td><td>linen for clothing<div class="muted small">per yard</div></td><td class="muted">weaving</td><td class="snlt">30 min</td>
      <td><div class="actions"><span class="btn">Edit</span><span class="btn reveal">Reveal</span></div></td></tr>
    <tr class="hover"><td class="name">coat</td><td>coat for warmth<div class="muted small">per coat</div></td><td class="muted">tailoring</td><td class="snlt">600 min</td>
      <td><div class="actions"><span class="btn">Edit</span><span class="btn reveal">Reveal</span></div></td></tr>
    <tr><td class="name">corn</td><td>grain for nourishment<div class="muted small">per quarter</div></td><td class="muted">cultivating</td><td class="snlt">2,400 min</td>
      <td><div class="actions"><span class="btn">Edit</span><span class="btn reveal">Reveal</span></div></td></tr>
  </tbody>
</table>
</div></body></html>
