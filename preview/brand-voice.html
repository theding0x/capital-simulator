<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.row { display: flex; gap: 22px; padding: 14px 0; border-bottom: 1px solid var(--rule); align-items: flex-start; }
.row:last-child { border: none; }
.k { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-dim); width: 88px; flex-shrink: 0; padding-top: 4px; }
.q { font-family: var(--font-sans); font-style: italic; font-size: 0.92rem; color: var(--ink); line-height: 1.55; max-width: 480px; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink); padding: 0.36rem 0.8rem; border: 1px solid var(--border); border-radius: 4px; }
.lbl { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-dim); }
</style></head><body><div class="card-frame">
<div class="row"><div class="k">Chrome / quote</div>
  <div class="q">"Money is a crystal formed of necessity in the course of exchanges."</div>
</div>
<div class="row"><div class="k">UI / button</div>
  <div class="btns">
    <span class="btn">Register</span>
    <span class="btn">Compute ratio</span>
    <span class="btn">Set universal equivalent</span>
    <span class="btn">Crystallise into money</span>
    <span class="btn">Withdraw</span>
  </div>
</div>
<div class="row"><div class="k">UI / label</div>
  <div class="btns">
    <span class="lbl">SNLT (min/unit)</span>
    <span class="lbl">Use-value description</span>
    <span class="lbl">Concrete labour kind</span>
  </div>
</div>
<div class="row"><div class="k">Empty</div>
  <div style="font-family:var(--font-sans); font-size: 0.85rem; color: var(--ink-dim)">No commodities registered yet.</div>
</div>
</div></body></html>
