<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.h2 { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 22px; }
.eq { font-family: var(--font-display); font-size: 2rem; font-weight: 600; color: var(--ink); display:flex; align-items:baseline; gap: 1rem; flex-wrap: wrap; line-height: 1.2; }
.qty { font-family: var(--font-mono); color: #5a6a9e; font-variant-numeric: tabular-nums; font-size: 1.6rem; }
.unit { font-weight: 400; font-style: italic; color: var(--ink-muted); font-size: 1.1rem; }
.sign { color: var(--ink-dim); font-weight: 300; font-size: 1.6rem; }
.common { margin-top: 0.75rem; font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-dim); letter-spacing: 0.04em; text-transform: uppercase; }
</style></head><body><div class="card-frame">
<div class="h2">Exchange ratio &mdash; result</div>
<div class="eq">
  <span><span class="qty">20</span> <span class="unit">yards linen</span></span>
  <span class="sign">=</span>
  <span><span class="qty">1</span> <span class="unit">coat</span></span>
</div>
<div class="common">common value: 600 min of abstract human labour</div>
</div></body></html>
