<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.box { padding: 30px 28px; background: var(--surface); border: 1px solid var(--border-subtle); display:flex; align-items:center; gap: 24px; }
.wm { font-family: var(--font-display); font-size: 2rem; font-weight: 700; color: #c8a240; letter-spacing: -0.01em; }
.sub { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-muted); padding-left: 16px; border-left: 1px solid var(--rule); line-height: 1.7; }
.note { font-family: var(--font-sans); font-style: italic; font-size: 0.78rem; color: var(--ink-muted); margin-top: 14px; max-width: 540px; line-height: 1.55; }
</style></head><body><div class="card-frame">
<div class="box">
  <span class="wm">Capital Simulator</span>
  <span class="sub">Vol. I &middot; Ch. 02 &mdash; Exchange</span>
</div>
<div class="note">There is no logo asset. The wordmark is the literal string in Playfair Display 700 set against a dark surface — treated like a typeset book title, not a logo.</div>
</div></body></html>
